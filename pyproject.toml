[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claugram"
version = "0.1.0"
description = "Claude Code <-> Telegram bridge: remote control and human-in-the-loop for Claude Code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nguyen Manh Cuong" }]
keywords = ["claude", "claude-code", "telegram", "mcp", "human-in-the-loop"]
dependencies = [
    "typer>=0.12",
    "mcp>=1.2",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
claugram = "claugram.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/claugram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
